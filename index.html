<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЖНГК</title>
<style>
  :root{
    --oil: #2a1c10;
    --oil-2: #3a2716;
    --oil-3: #1c120a;
    --yellow: #f5b400;
    --yellow-soft: #ffd257;
    --text: #f4ead9;
    --muted: rgba(244,234,217,0.6);
    --line: rgba(244,234,217,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--oil-3);
    color:var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  .topbar{
    width:100%;
    max-width:520px;
    padding:14px 14px 10px;
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(180deg, var(--oil-3) 60%, transparent);
  }
  .search{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--oil-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .search svg{ flex-shrink:0; }
  .search input{
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-size:0.95rem;
    width:100%;
  }
  .search input::placeholder{ color:var(--muted); }
  .chip-row{
    display:flex;
    gap:8px;
    margin-top:10px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    padding:7px 14px;
    border-radius:100px;
    background:var(--oil-2);
    border:1px solid var(--line);
    font-size:0.78rem;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--yellow);
    color:var(--oil-3);
    border-color:var(--yellow);
  }
  .map-title{
    font-size:1.1rem;
    font-weight:800;
    letter-spacing:0.02em;
    margin-bottom:10px;
  }

  .map-wrap{
    position:relative;
    width:100%;
    max-width:520px;
    overflow:hidden;
    flex:1;
  }
  .map-wrap img{
    display:block;
    width:100%;
    height:auto;
  }
  .pin{
    position:absolute;
    transform:translate(-50%,-100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    z-index:5;
  }
  .pin .stem{
    width:34px; height:34px;
    border-radius:50% 50% 50% 0;
    background:var(--yellow);
    border:2.5px solid var(--oil-3);
    transform:rotate(-45deg);
    box-shadow:0 3px 10px rgba(0,0,0,0.5);
    transition:transform .15s ease, background .15s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .pin .stem::after{
    content:'';
    width:11px; height:11px;
    border-radius:50%;
    background:var(--oil-3);
    transform:rotate(45deg);
  }
  .pin.active .stem{
    background:var(--yellow-soft);
    transform:rotate(-45deg) scale(1.2);
  }
  .pin .tag{
    position:absolute;
    bottom:38px;
    background:rgba(28,18,10,0.94);
    border:1px solid var(--line);
    color:var(--text);
    font-size:0.68rem;
    font-weight:700;
    padding:4px 9px;
    border-radius:7px;
    white-space:nowrap;
    pointer-events:none;
  }

  .sheet{
    width:100%;
    max-width:520px;
    background:var(--oil);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    border-top:1px solid var(--line);
    box-shadow:0 -12px 30px rgba(0,0,0,0.4);
    padding:10px 18px 22px;
    position:relative;
    z-index:10;
  }
  .sheet .handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:100px;
    margin:0 auto 14px;
  }
  .sheet-title{
    font-size:1.15rem;
    font-weight:800;
    margin-bottom:4px;
  }
  .sheet-desc{
    font-size:0.85rem;
    color:var(--muted);
    line-height:1.4;
    margin-bottom:14px;
  }
  .sheet-empty{
    font-size:0.85rem;
    color:var(--muted);
    text-align:center;
    padding:14px 0 6px;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .list-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    cursor:pointer;
    transition:all .15s ease;
  }
  .list-item.active{
    border-color:var(--yellow);
    background:rgba(245,180,0,0.08);
  }
  .list-item .badge{
    width:30px; height:30px;
    border-radius:50%;
    background:var(--yellow);
    color:var(--oil-3);
    font-size:0.72rem;
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .list-item .badge.pending{
    background:var(--oil-2);
    color:var(--muted);
    border:1px dashed var(--muted);
  }
  .list-item .name{ font-weight:700; font-size:0.92rem; }
  .list-item .desc{ font-size:0.74rem; color:var(--muted); margin-top:1px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="map-title">ЖНГК</div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f5b400" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" placeholder="Цех немесе нысан іздеу">
  </div>
  <div class="chip-row" id="chipRow"></div>
</div>

<div class="map-wrap">
  <img src="factory.png" alt="Зауыт спутник көрінісі">

  <div class="pin" data-id="kks" style="left:24.1%; top:53.4%;">
    <div class="tag">ККС</div>
    <div class="stem"></div>
  </div>

  <div class="pin" data-id="zsvts" style="left:16.3%; top:60%;">
    <div class="tag">ЖСВЦ</div>
    <div class="stem"></div>
  </div>

  <div class="pin" data-id="zgpz2" style="left:33.9%; top:61%;">
    <div class="tag">ЖГПЗ №2</div>
    <div class="stem"></div>
  </div>

  <div class="pin" data-id="cpg" style="left:41%; top:63.5%;">
    <div class="tag">ЦПГиПС-2</div>
    <div class="stem"></div>
  </div>
</div>

<div class="sheet">
  <div class="handle"></div>
  <div id="sheetDetail"></div>
  <div class="list" id="list"></div>
</div>

<script>
  const zones = [
    { id:'kks', name:'ККС', desc:'Концентрационная компрессорная станция' },
    { id:'zsvts', name:'ЖСВЦ', desc:'(уточните расшифровку)' },
    { id:'zgpz2', name:'ЖГПЗ №2', desc:'Жанажольский газоперерабатывающий завод №2' },
    { id:'cpg', name:'ЦПГиПС-2', desc:'Цех подготовки газа и получения серы (1 и 2 очередь)' },
    { id:'ksvd', name:'КСВД', desc:'Компрессорная станция высокого давления — место на карте уточняется', noPin:true },
  ];

  const chipRow = document.getElementById('chipRow');
  const list = document.getElementById('list');
  const sheetDetail = document.getElementById('sheetDetail');

  zones.forEach((z, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.id = z.id;
    chip.textContent = z.name;
    chipRow.appendChild(chip);

    const item = document.createElement('div');
    item.className = 'list-item';
    item.dataset.id = z.id;
    item.innerHTML = `
      <div class="badge${z.noPin ? ' pending' : ''}">${z.noPin ? '?' : (i+1)}</div>
      <div>
        <div class="name">${z.name}</div>
        <div class="desc">${z.desc}</div>
      </div>`;
    list.appendChild(item);
  });

  function showDetail(id){
    const z = zones.find(x => x.id === id);
    if(!z){
      sheetDetail.innerHTML = `<div class="sheet-empty">Нысанды таңдаңыз</div>`;
      return;
    }
    sheetDetail.innerHTML = `
      <div class="sheet-title">${z.name}</div>
      <div class="sheet-desc">${z.desc}</div>`;
  }

  function setActive(id){
    document.querySelectorAll('.pin').forEach(p => p.classList.toggle('active', p.dataset.id === id));
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
    document.querySelectorAll('.list-item').forEach(l => l.classList.toggle('active', l.dataset.id === id));
    showDetail(id);
  }

  document.querySelectorAll('.pin').forEach(pin => {
    pin.addEventListener('click', () => setActive(pin.dataset.id));
  });
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => setActive(chip.dataset.id));
  });
  document.querySelectorAll('.list-item').forEach(item => {
    item.addEventListener('click', () => setActive(item.dataset.id));
  });

  showDetail(null);
</script>

</body>
</html>
